name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      optimize:
        description: 'optimize mode'
        type: choice
        default: ReleaseSmall
        options: [ReleaseSafe, ReleaseSmall, ReleaseFast]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # arch keyword for -Drelease_filter (exact match against the arch part of each triple)
        target: [x86_64, aarch64, arm, riscv64, mipsel, mips, mips64el, mips64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig 0.15.2 (official)
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xJf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$PWD/zig-x86_64-linux-0.15.2/zig" version  # GITHUB_PATH only applies to later steps; use the full path here
      - name: Install qemu-user-static (cross-target tests)
        run: |
          echo "::group::Install qemu-user-static"
          sudo apt-get update -qq
          sudo apt-get install -qq qemu-user-static
          echo "::endgroup::"
      - name: Build release target
        run: zig build release -Doptimize=${{ inputs.optimize || 'ReleaseSmall' }} -Drelease_filter=${{ matrix.target }}
      - name: Test release target (unit tests + fixtures smoke, qemu for cross)
        # note: qemu-mips (big-endian 32-bit O32) emulation has a musl libc
        # 64-bit-return bug (localtime_r shows 1970-01-01 timestamps); it only
        # affects log timestamps under qemu, real mips hardware is unaffected.
        run: zig build release-test -Doptimize=${{ inputs.optimize || 'ReleaseSmall' }} -Drelease_filter=${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          for f in zig-out/bin/subfetch-*; do
            base=$(basename "$f")
            cp "$f" "dist/$base"
          done
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: subfetch-${{ matrix.target }}
          path: dist/

  test:
    # native-only full test suite: unit + all 9 format smokes + the three
    # integration suites (install path / exit codes / flock lock). cross-arch
    # coverage lives in the build job (release-test); integration tests need
    # real processes/fs/locks and are meaningless under qemu - native only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig 0.15.2 (official)
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xJf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$PWD/zig-x86_64-linux-0.15.2/zig" version
      - name: Unit tests
        run: zig build test
      - name: Smoke tests (all 9 formats)
        run: zig build smoke-test
      - name: "Integration: install path"
        run: zig build smoke-install
      - name: "Integration: exit codes"
        run: zig build smoke-exitcodes
      - name: "Integration: flock lock"
        run: zig build smoke-lock

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

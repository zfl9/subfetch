name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Zig 0.15.2 (official)
        run: |
          wget -q https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          tar xJf zig-x86_64-linux-0.15.2.tar.xz
          echo "$PWD/zig-x86_64-linux-0.15.2" >> "$GITHUB_PATH"
          "$PWD/zig-x86_64-linux-0.15.2/zig" version  # GITHUB_PATH only applies to later steps; use the full path here
      - name: Install qemu-user-static (cross-target tests)
        run: |
          echo "::group::Install qemu-user-static"
          sudo apt-get update -qq
          sudo apt-get install -qq qemu-user-static
          echo "::endgroup::"
      - name: Build all release targets
        run: zig build release
      - name: Test all release targets (unit tests + fixtures smoke, qemu for cross)
        run: zig build release-test
      - name: Package
        run: |
          mkdir -p dist
          for f in zig-out/bin/subfetch-*; do
            base=$(basename "$f")
            cp "$f" "dist/$base"
          done
          ls -la dist/
      - uses: actions/upload-artifact@v7
        with:
          name: subfetch-all
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
